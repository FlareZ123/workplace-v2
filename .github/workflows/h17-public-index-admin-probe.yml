name: H17 public index admin-route probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public admin route and referenced site assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          base = "https://noyes-energy-group.pages.dev"
          paths = ["/admin", "/admin/", "/assets/site.js", "/robots.txt", "/company/", "/insights/"]

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.title_parts = []
                  self.text_parts = []
                  self.forms = []
                  self.current_form = None
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  tag = tag.lower()
                  for key in ("href", "src", "action"):
                      if a.get(key):
                          self.refs.append(a[key])
                  if tag == "title":
                      self.title = True
                  if tag == "form":
                      self.current_form = {"action": a.get("action", ""), "method": a.get("method", "get").lower(), "inputs": []}
                      self.forms.append(self.current_form)
                  if tag in ("input", "button", "textarea", "select") and self.current_form is not None:
                      self.current_form["inputs"].append({
                          "tag": tag, "name": a.get("name", ""),
                          "type": a.get("type", ""), "placeholder": a.get("placeholder", "")
                      })
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "title":
                      self.title = False
                  if tag == "form":
                      self.current_form = None
              def handle_data(self, data):
                  if self.title:
                      self.title_parts.append(data)
                  if data.strip():
                      self.text_parts.append(data.strip())

          results = []
          for path in paths:
              url = urllib.parse.urljoin(base, path)
              req = urllib.request.Request(url, headers={"User-Agent": "H17-archive-research/1.0"})
              item = {"path": path, "url": url}
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      data = response.read(2_000_000)
                      ctype = response.headers.get("Content-Type", "")
                      item.update({
                          "status": response.status, "final_url": response.geturl(),
                          "content_type": ctype, "bytes_read": len(data),
                          "sha256": hashlib.sha256(data).hexdigest()
                      })
                      text = data.decode("utf-8", errors="replace")
                      if "html" in ctype.lower():
                          parser = Page()
                          parser.feed(text)
                          item["title"] = " ".join(" ".join(parser.title_parts).split())[:200]
                          item["forms"] = parser.forms
                          item["visible_text_excerpt"] = " ".join(parser.text_parts)[:1200]
                          refs = []
                          for ref in parser.refs:
                              absolute = urllib.parse.urljoin(response.geturl(), ref)
                              if urllib.parse.urlparse(absolute).netloc == urllib.parse.urlparse(base).netloc:
                                  refs.append(urllib.parse.urlparse(absolute).path)
                          item["same_origin_paths"] = sorted(set(refs))[:200]
                      elif path.endswith("site.js"):
                          item["route_literals"] = sorted(set(re.findall(r"""['"](/[^'"]*(?:api|admin|mail|record|archive|search|login|h17)[^'"]*)['"]""", text, re.I)))[:200]
                          item["relevant_tokens"] = sorted(set(re.findall(r"""(?i)(?:IR-261003-H17|mug-stock|correspondence|mailbox|archive|h17|login|search)""", text)))[:100]
                      elif path.endswith("robots.txt"):
                          item["robots_text"] = text[:4000]
              except urllib.error.HTTPError as e:
                  data = e.read(200_000)
                  item.update({"status": e.code, "content_type": e.headers.get("Content-Type", ""), "bytes_read": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              except Exception as e:
                  item.update({"status": "ERROR", "error_type": type(e).__name__, "error": str(e)[:240]})
              results.append(item)

          with open("h17-public-index-admin-probe.json", "w", encoding="utf-8") as f:
              json.dump({"base": base, "results": results}, f, indent=2)
          print(json.dumps(results, indent=2))
          PY
      - name: Upload extracted public route metadata
        uses: actions/upload-artifact@v4
        with:
          name: h17-public-index-admin-probe
          path: h17-public-index-admin-probe.json
          retention-days: 1
