name: Agent9 K08 genuine purpose-swap counterfactual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purpose-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case_id: [2, 6, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scoring dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Original source and heldout words smoke
        run: python agents/agent9/k08_blind_author_rank_sft.py --case ${{ matrix.case_id }} --smoke
      - name: Rank original controls under matched wrong-purpose description
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          python -c 'import agents.agent9.k08_blind_author_rank_sft as m; i=${{ matrix.case_id }}; j={2:6,6:2,17:18,18:17}[i]; m.ROLE[i]=m.ROLE[j]; m.main()' --case ${{ matrix.case_id }}
