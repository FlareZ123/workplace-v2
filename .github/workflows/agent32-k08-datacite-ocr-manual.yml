name: Agent 32 DataCite OCR metadata probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve DataCite metadata
        run: python agents/agent32/k08_datacite_ocr_probe.py
