name: Agent 32 K08 Riddle OCR page-word test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install pymupdf pytesseract pillow
      - name: OCR target pages and test K08 commitment
        run: python agents/agent32/k08_riddle_pageword_ocr_sft.py
