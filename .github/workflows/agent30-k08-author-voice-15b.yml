name: Agent30 K08 four-control source-masked 1.5B author voice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-author-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install working CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers==4.57.1' 'accelerate>=1.0,<2' 'filelock>=3.0,<4'
      - name: Assert all genuine source masks before downloading the language model
        run: python agents/agent30/k08_author_voice_15b_sft.py --mask-check-only
      - name: Generate complete source-conditioned captions and compare unchanged K08 commitment
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
        run: python agents/agent30/k08_author_voice_15b_sft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent30-k08-author-voice-1p5b-all-batches
          path: agents/agent30/k08_author_voice_15b_candidates.jsonl
          if-no-files-found: warn
