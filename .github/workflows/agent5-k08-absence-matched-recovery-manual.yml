name: Agent5 K08 absence-matched exact recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-exact-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Validate source pins and both masking arms
        run: |
          python -m py_compile agents/agent5/k08_absence_matched_exact_recovery_sft.py
          python agents/agent5/k08_absence_matched_exact_recovery_sft.py --smoke
      - name: Run paired blind controls and frozen N23 candidate stream
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python agents/agent5/k08_absence_matched_exact_recovery_sft.py --samples 100 --final-samples 256 --output h17-k08-absence-matched-output.json
      - name: Confirm original source and verifier are unchanged
        run: git diff --exit-code -- resources acceptance.json verify.py candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent5-k08-absence-matched-${{ github.run_id }}
          path: h17-k08-absence-matched-output.json
          if-no-files-found: ignore
          retention-days: 14
