name: Agent41 K08 Falcon map control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only scan dependencies
        run: python -m pip install --disable-pip-version-check --quiet pymupdf pillow numpy opencv-python-headless
      - name: Validate frozen teal decoder on synthetic positive control
        run: python -m unittest work/test_h17_k08_teal_bit_image_scan.py
      - name: Run frozen six-slot grayscale map control
        run: python agents/agent41/k08_falcon_map_control.py
      - name: Run pre-registered teal-mask LOW-IF-EVEN scan on color rear foldout
        run: python agents/agent50/k08_falcon_rear_map_teal_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent41-k08-falcon-map-control
          path: agent41-k08-falcon-map-control/
          if-no-files-found: error
