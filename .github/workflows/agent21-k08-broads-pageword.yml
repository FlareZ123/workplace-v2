name: Agent 21 K08 Land of the Broads K01 page-word test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text extraction
        run: python -m pip install pymupdf pillow
      - name: Fetch the public 1887 scan
        run: |
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 \
            -A "Mozilla/5.0 H17-archive-preservation-research/1.0" \
            "https://upload.wikimedia.org/wikipedia/commons/d/d5/The_land_of_the_Broads_-_a_pratical_and_illustrated_guide_to_the_extensive_but_little-known_district_of_the_broads_of_Norfolk_and_Suffolk_%28IA_landofbroadsprat00suffrich%29.pdf" \
            -o /tmp/land-of-the-broads-1887.pdf
          sha256sum /tmp/land-of-the-broads-1887.pdf
      - name: Extract signed K01 page-word coordinates and test K08
        run: python agents/agent21/k08_broads_pageword_probe.py /tmp/land-of-the-broads-1887.pdf
      - name: Preserve the bounded result for the next incarnation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/agent21/broads-pageword-results.json
          git commit -m "Agent 21: preserve Broads page-word probe output" || true
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent21-k08-broads-pageword-results
          path: agents/agent21/broads-pageword-results.json
          retention-days: 3
