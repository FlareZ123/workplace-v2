name: Agent14 H17 public site JS endpoint screen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-js:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only the published JavaScript, never follow discovered paths
        run: python agents/agent14/h17_public_site_js_endpoint_sft.py
