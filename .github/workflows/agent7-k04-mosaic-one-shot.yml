name: Agent7 K04 three-retry byte mosaic manual
on:
  workflow_dispatch:
jobs:
  original-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run full original 3^16 candidate test
        shell: bash
        run: |
          cc -O3 -Wall -Wextra -o /tmp/k04_recover_mosaic agents/agent7/k04_recovers_mosaic_sft.c -lcrypto
          /tmp/k04_recover_mosaic resources
