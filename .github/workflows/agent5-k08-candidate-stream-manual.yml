name: Agent5 K08 exact candidate-stream calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [0, 2, 6, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Validate neutral-role prompts and candidate-stream wrapper
        run: |
          python -m py_compile agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py
          python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case ${{ matrix.case }} --smoke
      - name: Generate exact whole-caption control and final streams
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case ${{ matrix.case }} --beams 64 2>&1 | tee "k08-v3-case-${{ matrix.case }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent5-k08-v3-case-${{ matrix.case }}-${{ github.run_id }}
          path: k08-v3-case-${{ matrix.case }}.log
          if-no-files-found: ignore
          retention-days: 14
