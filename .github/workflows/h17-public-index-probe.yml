name: H17 public index probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe referenced public records index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          base = "https://noyes-energy-group.pages.dev"
          paths = [
              "/", "/robots.txt", "/sitemap.xml",
              "/IR-261003-H17.txt",
              "/Records/INDEX/IR-261003-H17.txt",
              "/records/INDEX/IR-261003-H17.txt",
              "/Stores/consumables/mug-stock.xls",
              "/stores/consumables/mug-stock.xls",
              "/index.json", "/api/index.json", "/api/",
              "/search?q=IR-261003-H17", "/mail/", "/mail/20.eml",
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.title_text = []
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  for key in ("href", "src", "action"):
                      value = a.get(key)
                      if value:
                          self.refs.append(value)
                  if tag.lower() == "title":
                      self.title = True
              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.title = False
              def handle_data(self, data):
                  if self.title:
                      self.title_text.append(data)

          results = []
          for path in paths:
              url = urllib.parse.urljoin(base, path)
              req = urllib.request.Request(url, headers={"User-Agent": "H17-archive-research/1.0"})
              item = {"path": path, "url": url}
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      data = response.read(2_000_000)
                      ctype = response.headers.get("Content-Type", "")
                      item.update({
                          "status": response.status,
                          "final_url": response.geturl(),
                          "content_type": ctype,
                          "bytes_read": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      })
                      if "html" in ctype.lower():
                          parser = Links()
                          parser.feed(data.decode("utf-8", errors="replace"))
                          item["title"] = " ".join(" ".join(parser.title_text).split())[:200]
                          refs = []
                          for ref in parser.refs:
                              absolute = urllib.parse.urljoin(response.geturl(), ref)
                              if urllib.parse.urlparse(absolute).netloc == urllib.parse.urlparse(base).netloc:
                                  refs.append(urllib.parse.urlparse(absolute).path)
                          item["same_origin_paths"] = sorted(set(refs))[:200]
                      elif path.endswith(("robots.txt", "sitemap.xml")):
                          text = data.decode("utf-8", errors="replace")
                          if path.endswith("robots.txt"):
                              item["sitemap_lines"] = [line.strip() for line in text.splitlines() if line.lower().startswith("sitemap:")][:20]
                          else:
                              item["sitemap_locations"] = [line.strip() for line in text.splitlines() if "<loc>" in line][:100]
              except urllib.error.HTTPError as e:
                  data = e.read(200_000)
                  item.update({"status": e.code, "content_type": e.headers.get("Content-Type", ""), "bytes_read": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              except Exception as e:
                  item.update({"status": "ERROR", "error_type": type(e).__name__, "error": str(e)[:240]})
              results.append(item)

          with open("h17-public-index-probe.json", "w", encoding="utf-8") as f:
              json.dump({"base": base, "results": results}, f, indent=2)
          print(json.dumps(results, indent=2))
          PY
      - name: Upload metadata-only probe result
        uses: actions/upload-artifact@v4
        with:
          name: h17-public-index-probe
          path: h17-public-index-probe.json
          retention-days: 1
