name: H17 public correspondence index probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe source-linked public index
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          base = "https://noyes-energy-group.pages.dev"
          paths = [
              "/", "/robots.txt", "/sitemap.xml", "/index.html",
              "/BX25-transfer-index.pdf",
              "/H17-POL-17/BX25-transfer-index.pdf",
              "/records/IR-261003-H17.txt",
              "/IT/desk-images/oldscan/scanrelease.txt",
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag in ("a", "link", "script", "img"):
                      d = dict(attrs)
                      v = d.get("href") or d.get("src")
                      if v:
                          self.links.append((tag, v))

          for path in paths:
              url = base + path
              req = urllib.request.Request(url, headers={"User-Agent": "H17-archive-preservation-research/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(2_000_001)
                      ctype = response.headers.get("Content-Type", "")
                      print(f"\nURL {url}\nSTATUS {response.status}\nFINAL {response.geturl()}\nTYPE {ctype}\nBYTES_READ {len(body)}\nSHA256 {hashlib.sha256(body).hexdigest()}")
                      if len(body) > 2_000_000:
                          print("TRUNCATED at 2MB")
                      if "text" in ctype or "json" in ctype or path.endswith((".txt", ".html", ".xml")):
                          text = body[:20000].decode("utf-8", "replace")
                          print("BODY_BEGIN")
                          print(text)
                          print("BODY_END")
                          if "html" in ctype or path.endswith((".html", "/")):
                              parser = Links()
                              parser.feed(text)
                              print("LINKS", parser.links[:100])
              except urllib.error.HTTPError as e:
                  print(f"\nURL {url}\nHTTP_ERROR {e.code} {e.reason}")
                  try: print(e.read(1000).decode("utf-8", "replace"))
                  except Exception: pass
              except Exception as e:
                  print(f"\nURL {url}\nERROR {type(e).__name__}: {e}")
          PY
