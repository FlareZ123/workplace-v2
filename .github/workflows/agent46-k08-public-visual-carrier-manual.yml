name: Agent46 source-carrier research controls
on:
  workflow_dispatch:
    inputs:
      study:
        description: Existing source-only study to run
        required: true
        type: choice
        default: public-visual
        options:
          - public-visual
          - rc17
permissions:
  contents: read
jobs:
  public-visual:
    if: ${{ inputs.study == 'public-visual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect linked public image metadata without credentials
        run: python agents/agent46/k08_public_visual_carrier_sft.py
  rc17-bridge:
    if: ${{ inputs.study == 'rc17' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: RC17 historical source bridge and coupon quotient
        run: python agents/agent46/k04_rc17_adjacent_source_bridge_sft.py
