name: Agent1 K04 center-pivot triad
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  center-pivot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native XOR solver
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Execute frozen controls and gated source
        shell: bash
        run: |
          python -m py_compile agents/agent1/k04_center_pivot_triad_sft.py
          set -o pipefail
          python agents/agent1/k04_center_pivot_triad_sft.py --limit-seconds 120 --source-limit-seconds 180 --source | tee center-pivot.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-pivot-triad-results
          path: center-pivot.ndjson
          if-no-files-found: warn
