name: Agent 49 Childers page-word K08 candidate test
on:
  push:
    paths:
      - ".github/workflows/agent49-k08-childers-pageword.yml"
      - "agents/agent49/k08_childers_pageword_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent49-childers-pageword
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Fetch public-domain 1903 edition scan
        run: |
          curl -fL --retry 2 --connect-timeout 15 --max-time 180 \
            -A "Mozilla/5.0 (compatible; H17ArchiveResearch/1.0)" \
            "https://upload.wikimedia.org/wikipedia/commons/e/ed/The_Riddle_of_the_Sands-_A_Record_of_Secret_Service_%28IA_dli.granth.107255%29.pdf" \
            -o /tmp/riddle-of-the-sands-1903.pdf
          sha256sum /tmp/riddle-of-the-sands-1903.pdf
      - name: OCR and test signed WN14 page-word coordinates
        run: python agents/agent49/k08_childers_pageword_probe.py /tmp/riddle-of-the-sands-1903.pdf
