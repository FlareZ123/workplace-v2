name: Agent 1 K04 Z3 bit-vector backend pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z3-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Z3
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.4.0
      - name: Solve synthetic control and original first-pair source
        run: |
          set -o pipefail
          python agents/agent1/k04_xoroshiro128pp_z3_sft.py --view 0 --timeout-seconds 300 | tee z3-k04-first-pair.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k04-z3-view-0
          path: z3-k04-first-pair.jsonl
          if-no-files-found: warn
