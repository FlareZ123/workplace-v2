name: Agent48 H17 public correspondence index probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only listed public pages from the PDF-disclosed site
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import urllib.request, urllib.error, re
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__(); self.a=[]; self.t=[]; self.skip=0
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='a' and 'href' in d:self.a.append(d['href'])
                  if tag in ('script','style'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style'):self.skip=max(0,self.skip-1)
              def handle_data(self,data):
                  if not self.skip: self.t.append(data)
          base='https://noyes-energy-group.pages.dev'
          paths=['/assets/site.js','/insights/a-long-term-view/','/insights/the-connected-energy-system/','/insights/beyond-the-solar-panel/','/expertise/']
          for path in paths:
              print('=== PUBLIC PATH',path,'===')
              try:
                  req=urllib.request.Request(base+path, headers={'User-Agent':'H17-records-index-readonly/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read(40000).decode('utf-8','replace')
                      print('STATUS',response.status,'CONTENT_TYPE',response.headers.get('Content-Type'))
                  if '<html' in body.lower():
                      x=Extract();x.feed(body)
                      s=' '.join(' '.join(x.t).split())
                      print('PUBLIC_TEXT',s[:7000])
                      print('LINKS',' | '.join(sorted(set(x.a))[:100]))
                  else:print('PUBLIC_TEXT',body[:5000])
              except urllib.error.HTTPError as e:print('HTTP',e.code)
              except Exception as e:print('ERROR',type(e).__name__,str(e))
          PY
