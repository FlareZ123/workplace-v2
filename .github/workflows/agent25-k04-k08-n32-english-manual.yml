name: Agent25 K04 K08 n32 English quadgram source crack
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  literal-source-language:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Source-derived n32 English text seed and genuine heldout tests
        run: python agents/agent25/k04_k08_n32_english_quadgram_sft.py --shard ${{ matrix.shard }}
