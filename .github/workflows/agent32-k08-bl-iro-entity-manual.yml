name: Agent 32 British Library IRO entity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public OCR dataset metadata and API
        run: python agents/agent32/k08_bl_iro_entity_probe.py
