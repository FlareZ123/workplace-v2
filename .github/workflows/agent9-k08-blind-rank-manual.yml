name: Agent9 K08 original author-purpose masked-ranker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        case_id: [2, 6, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU language model packages
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Check original-source masking and known draft HMAC
        run: |
          python -m py_compile agents/agent9/k08_blind_author_rank_sft.py
          python agents/agent9/k08_blind_author_rank_sft.py --case ${{ matrix.case_id }} --smoke
      - name: Rank authentic previously concealed caption against source decoys
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python agents/agent9/k08_blind_author_rank_sft.py --case ${{ matrix.case_id }}
