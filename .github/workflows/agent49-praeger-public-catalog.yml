name: Agent 49 Praeger public catalog access probe
# Metadata-only; no book content is downloaded or accessed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query public catalog and item access metadata only
        run: python agents/agent49/praeger_public_catalog_probe.py
