name: Agent 49 Praeger public catalog access probe
# v1.1: inspect Internet Archive file-access metadata only; never fetch book content.
on:
  push:
    paths:
      - ".github/workflows/agent49-praeger-public-catalog.yml"
      - "agents/agent49/praeger_public_catalog_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent49-praeger-public-catalog
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query public catalog and item access metadata only
        run: python agents/agent49/praeger_public_catalog_probe.py
