name: Agent 6 K04 one-hidden-word-per-row interleave SFT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-sft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-pinned SFT
        run: python agents/agent6/k04_oneword_perrow_interleave_sft.py
