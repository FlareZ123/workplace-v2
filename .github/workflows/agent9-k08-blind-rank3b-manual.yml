name: Agent9 K08 source-masked 3B author rank calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case_id: [2, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned scoring software
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Smoke original source, HMAC, all words masked
        run: python agents/agent9/k08_blind_author_rank_sft.py --case ${{ matrix.case_id }} --smoke
      - name: Original historical rank with 3B model
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          python -c 'import agents.agent9.k08_blind_author_rank_sft as m; m.MODEL="Qwen/Qwen2.5-3B-Instruct"; m.main()' --case ${{ matrix.case_id }}
