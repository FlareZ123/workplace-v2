name: Agent6 K04 xoroshiro128++ direct positive-control gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned bit-vector solver
        run: python -m pip install pyboolector==3.2.4.19199673826
      - name: Require a recovered state on the planted six-output control before original-source use
        run: python agents/agent50/k04_xoroshiropp_boolector_sft.py --view 0 --solver-mode direct --control-only
