name: Agent20 Cowper rear-map teal-bit candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cowper-rear-map:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser and image dependencies
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          python -m pip install --upgrade pip pillow
      - name: Capture Cowper Part II pages 360-390
        shell: pwsh
        run: node agents/agent20/cowper_rear_map_capture.cjs
      - name: Sample K01 coordinates and test K08 commitment
        shell: pwsh
        run: python agents/agent20/cowper_rear_map_teal_bit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent20-cowper-rear-map-teal-bit
          path: out/cowper-rear-map/
          if-no-files-found: warn
