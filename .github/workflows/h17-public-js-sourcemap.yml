name: H17 public JS declared source-map witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-map:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit only script-declared same-origin public source map
        run: python agents/agent2/h17_public_js_sourcemap_gate.py
