name: Agent20 K04 xoroshiro128++ first-pair Z3 control-gated reconstruction

on:
  workflow_dispatch:
    inputs:
      limit_seconds:
        description: "Per-check Z3 timeout cap; script also enforces a 600-second total solve budget"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  positive-control:
    name: Unseeded first-pair planted control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Z3 solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.4.0
      - name: Require unseeded SAT and planted-middle recovery; report holdout and uniqueness separately
        run: |
          set -o pipefail
          python agents/agent1/k04_xoroshiro128pp_z3_sft.py --view 0 --timeout-seconds "${{ inputs.limit_seconds }}" --synthetic-only | tee first-pair-z3-positive-control.jsonl
      - name: Preserve exact positive-control disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k04-first-pair-z3-positive-control
          path: first-pair-z3-positive-control.jsonl
          if-no-files-found: warn

  source:
    name: "Z3 original source view ${{ matrix.view }}"
    needs: positive-control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Z3 solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.4.0
      - name: Solve original first-pair source; report blind 18:03 holdout separately
        run: |
          set -o pipefail
          python agents/agent1/k04_xoroshiro128pp_z3_sft.py --view ${{ matrix.view }} --timeout-seconds "${{ inputs.limit_seconds }}" --source-only | tee first-pair-z3-view-${{ matrix.view }}.jsonl
      - name: Preserve exact source disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k04-first-pair-z3-view-${{ matrix.view }}
          path: first-pair-z3-view-${{ matrix.view }}.jsonl
          if-no-files-found: warn
