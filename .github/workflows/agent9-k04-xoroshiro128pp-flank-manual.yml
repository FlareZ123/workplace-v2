name: H17 K04 xoroshiro128++ bidirectional state reconstruction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Independent circuit witness and bidirectional transition checks
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --self-test
      - name: Plant authentic seed with missing middle and invert 16-bit state-prefix
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --control-only --limit-seconds 100
  source-brackets:
    needs: synthetic-control
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Reconstruct masked physical-coupon candidate from source flanks
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --view ${{ matrix.view }} --limit-seconds 240
