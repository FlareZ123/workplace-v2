name: H17 K04 xoroshiro128++ dual-solver request-flank inversion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-flanks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
        model: [elimination]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned alternative bit-vector solver
        run: python -m pip install pyboolector==3.2.4.19199673826
      - name: Seeded original-source bridge plus masked K04 candidate
        run: python agents/agent50/k04_xoroshiropp_boolector_sft.py --view ${{ matrix.view }} --solver-mode ${{ matrix.model }}
