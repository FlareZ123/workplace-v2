name: H17 K04 xoroshiro128++ native-XOR recovery experiment
on:
  workflow_dispatch:
    inputs:
      bracket_mode:
        description: "Observed packets for generator state constraints"
        required: true
        default: flanks
        type: choice
        options:
          - flanks
          - dispatch
permissions:
  contents: read
jobs:
  synthetic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native XOR SAT solver
        run: python -m pip install pycryptosat==5.14.7
      - name: Check all generated CNF and XOR clauses
        run: python agents/agent50/k04_xoroshiropp_xorcnf_sft.py --self-test
      - name: Recover hidden synthetic state before reading original source
        run: python agents/agent50/k04_xoroshiropp_xorcnf_sft.py --control-only --limit-seconds 240
  source-brackets:
    needs: synthetic-control
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native XOR SAT solver
        run: python -m pip install pycryptosat==5.14.7
      - name: Recover whole middle coupon from source bracket, then check original commitment
        run: python agents/agent50/k04_xoroshiropp_xorcnf_sft.py --view ${{ matrix.view }} --mode ${{ inputs.bracket_mode }} --limit-seconds 300
