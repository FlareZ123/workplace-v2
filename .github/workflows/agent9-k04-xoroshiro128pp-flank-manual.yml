name: H17 K04 xoroshiro128++ bidirectional state reconstruction
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Run source flanks or test SAT prefix costs"
        type: choice
        required: true
        default: source
        options:
          - source
          - calibrate
          - source-prefixes
permissions:
  contents: read
jobs:
  synthetic-control:
    if: inputs.experiment == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Independent circuit witness and bidirectional transition checks
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --self-test
      - name: Plant authentic seed with missing middle and invert 16-bit state-prefix
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --control-only --limit-seconds 100
  source-brackets:
    if: inputs.experiment == 'source'
    needs: synthetic-control
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Reconstruct masked physical-coupon candidate from source flanks
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --view ${{ matrix.view }} --limit-seconds 240
  prefix-calibration:
    if: inputs.experiment == 'calibrate'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        bits: [8, 10, 12, 14, 16]
        sign: [positive, negative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Recover planted missing-middle bracket at fixed true prefix
        if: matrix.sign == 'positive'
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --control-only --control-prefix-bits ${{ matrix.bits }} --limit-seconds 60
      - name: Reject planted bracket under wrong prefix
        if: matrix.sign == 'negative'
        run: python agents/agent50/k04_xoroshiropp_meet_sft.py --control-only --control-prefix-bits ${{ matrix.bits }} --control-negative --limit-seconds 60

  k07-source-prefixes:
    if: inputs.experiment == 'source-prefixes'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        view: [0, 1, 2, 3]
        # Official AX-7782 attempt-2 CHUNK checkpoints, seq0..7.
        # Each checkpoint is tested as both a big-endian 16-bit value and
        # as two raw bytes packed into the low bits of a little-endian word.
        prefix: [
          '0x8947', '0x4789',
          '0xCEDC', '0xDCCE',
          '0xB9CC', '0xCCB9',
          '0x73BA', '0xBA73',
          '0xB7E8', '0xE8B7',
          '0x7BE6', '0xE67B',
          '0x3302', '0x0233',
          '0xC5C9', '0xC9C5'
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XOR SAT engine
        run: python -m pip install pycryptosat==5.14.7
      - name: Predict the complete middle coupon from one source-indexed low-16 s0 prefix
        run: >-
          python agents/agent50/k04_xoroshiropp_meet_sft.py
          --view ${{ matrix.view }}
          --prefix-bits 16
          --prefix ${{ matrix.prefix }}
          --limit-seconds 180
