name: H17 K04 CPython A7-cut cvc5 search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    name: CPython seed n=${{ matrix.n }} stop=${{ matrix.stop }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - n: 2
            stop: 17
          - n: 3
            stop: 41
          - n: 4
            stop: 83
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cvc5 Python bindings
        run: python -m pip install --upgrade pip cvc5==1.3.2
      - name: Solve necessary source relaxation and validate complete stream
        run: >-
          python agents/agent43/k04_cpython_a7cut_cvc5.py
          --n ${{ matrix.n }}
          --stop ${{ matrix.stop }}
          --timeout-seconds 3600
          --candidate-limit 8
      - name: Preserve solver input and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h17-k04-cpython-n${{ matrix.n }}-cvc5
          path: artifacts/k04-cpython-cvc5/
          if-no-files-found: warn
