name: Agent26 K08 sentence-free inventory editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned scoring software
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Smoke source hashes and sentence-free inventories
        run: python agents/agent26/k08_inventory_editor_sft.py --smoke
      - name: Score blind inventory controls and run gated final-caption search
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: python agents/agent26/k08_inventory_editor_sft.py --run
