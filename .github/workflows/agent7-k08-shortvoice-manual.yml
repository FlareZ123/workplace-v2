name: Agent7 K08 3B compact author voice and negative-control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortvoice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene: [n02, n06, keeper, zoey_keeper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2" filelock
      - name: Compile and source-mask smoke
        run: |
          python -m py_compile agents/agent7/k08_shortvoice_original_sft.py
          python agents/agent7/k08_shortvoice_original_sft.py --case ${{ matrix.scene }} --smoke
      - name: Generate compact source-conditioned complete captions
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
        run: python agents/agent7/k08_shortvoice_original_sft.py --case ${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent7-shortvoice-${{ matrix.scene }}
          path: agents/agent7/k08_shortvoice_${{ matrix.scene }}.jsonl
          if-no-files-found: warn
