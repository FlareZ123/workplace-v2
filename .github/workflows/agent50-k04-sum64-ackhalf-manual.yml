name: Agent50 conditional-half-ACK xoroshiro++ source inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sum64-ackhalf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact bitvector solver
        run: python -m pip install "z3-solver>=4.12,<5"
      - name: Synthetic fully withheld other-half and complete coupon recovery
        run: |
          python agents/agent50/k04_xoropp_sum64_ackhalf_sft.py --synthetic --ack-half 0 --timeout-ms 60000 --max-models 8
          python agents/agent50/k04_xoropp_sum64_ackhalf_sft.py --synthetic --ack-half 1 --timeout-ms 60000 --max-models 8
      - name: Conditional original four serializers x two assumed half-witnesses
        run: |
          for view in 0 1 2 3; do
            for half in 0 1; do
              python agents/agent50/k04_xoropp_sum64_ackhalf_sft.py --source-view "$view" --ack-half "$half" --timeout-ms 45000 --max-models 8
            done
          done
