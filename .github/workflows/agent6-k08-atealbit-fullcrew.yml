name: Agent 6 K08 ATEALBIT full-crew exact scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: ATEALBIT shard ${{ matrix.lo }}-${{ matrix.hi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { lo: 0, hi: 1 }
          - { lo: 1, hi: 2 }
          - { lo: 2, hi: 3 }
          - { lo: 3, hi: 4 }
          - { lo: 4, hi: 5 }
          - { lo: 5, hi: 6 }
          - { lo: 6, hi: 7 }
          - { lo: 7, hi: 8 }
          - { lo: 8, hi: 9 }
          - { lo: 9, hi: 10 }
          - { lo: 10, hi: 11 }
          - { lo: 11, hi: 12 }
          - { lo: 12, hi: 13 }
          - { lo: 13, hi: 14 }
    steps:
      - uses: actions/checkout@v4
      - name: Build source-pinned scanner
        run: |
          g++ -O3 -std=c++17 -Wno-deprecated-declarations \
            agents/agent6/k08_atealbit_fullcrew_sft.cpp -lcrypto \
            -o /tmp/k08_atealbit_fullcrew_sft
      - name: Run exact eight-word initialism shard
        id: scan
        shell: bash
        run: |
          set +e
          /tmp/k08_atealbit_fullcrew_sft \
            resources/evidence/crew/noticeboard-and-desk-notes.txt \
            resources/evidence/crew/galley-and-stores.log \
            "${{ matrix.lo }}" "${{ matrix.hi }}" > shard.log 2>&1
          rc=$?
          cat shard.log
          cat shard.log >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 10 ]; then
            echo "::error::Original K08 commitment hit; inspect emitted phrase and component."
            exit 1
          fi
          exit "$rc"
      - name: Preserve shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k08-atealbit-fullcrew-${{ matrix.lo }}-${{ matrix.hi }}
          path: shard.log
          if-no-files-found: error
