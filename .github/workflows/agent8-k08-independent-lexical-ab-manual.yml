name: Agent8 K08 independent-lexical A-B and final candidate recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case_id: [2, 6, 17, 18, 0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Original-source, quote-removal and A-B leakage smoke
        run: python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case ${{ matrix.case_id }} --smoke
      - name: Generate exact-recovery control streams or final commitment candidates
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case ${{ matrix.case_id }}
