name: Agent22 Praeger 1947 signed page-word probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install capture and OCR dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr imagemagick
      - name: Capture frozen Praeger pages and evaluate
        run: node agents/agent22/k08_praeger_signed_probe.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent22-praeger-1947
          path: work/agent22-praeger-1947
          if-no-files-found: warn
