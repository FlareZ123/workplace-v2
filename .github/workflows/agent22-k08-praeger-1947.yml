name: Agent22 Praeger signed page-word probe

on:
  workflow_dispatch:
    inputs:
      volume_id:
        description: Google Books volume ID
        required: true
        default: uT5RAQAAIAAJ
      edition:
        description: Edition label
        required: true
        default: Methuen 1947 third edition

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRAEGER_VOLUME: ${{ inputs.volume_id }}
      PRAEGER_EDITION: ${{ inputs.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install capture and OCR dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr imagemagick
      - name: Capture frozen Praeger pages and evaluate
        run: node agents/agent22/k08_praeger_signed_probe.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent22-praeger-${{ inputs.volume_id }}
          path: work/agent22-praeger-${{ inputs.volume_id }}
          if-no-files-found: warn
