name: Agent2 K08 compact Emily source masked controls and final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        case: [0, 2, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible CPU model
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2" filelock
      - name: Validate original source and heldout masks
        run: |
          python -m py_compile agents/agent2/k08_short_context_author_sft.py
          python agents/agent2/k08_short_context_author_sft.py --case ${{ matrix.case }} --smoke
      - name: Generate and check original acceptance
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
        run: python agents/agent2/k08_short_context_author_sft.py --case ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-k08-shortvoice-${{ matrix.case }}
          path: agents/agent2/k08_shortvoice_case${{ matrix.case }}.jsonl
          if-no-files-found: warn
