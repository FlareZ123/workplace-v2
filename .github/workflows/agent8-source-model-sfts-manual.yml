name: Agent8 original-source MT624 and caption trials
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-sfts:
    name: Original H17 source-model SFTs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Masefield quotation hypotheses
        run: python agents/agent8/k08_seafever_literal_sft.py
      - name: Check HST PV and printer MT624 assembly
        run: python agents/agent8/k04_pv112_mt624_directstate_sft.py
      - name: Check original interpacket MT whole coupon constructions
        run: python agents/agent8/k04_mt_packet_boundary_sft.py
      - name: Check original stage-conditioned MT complete coupon
        run: python agents/agent8/k04_stage_conditioned_target_sft.py
      - name: Check original all42 source-stage short-gap exact pair theorem
        run: python agents/agent8/k04_mt_all42_shortgap_sft.py
      - name: Install mathematical MILP runtime
        run: python -m pip install --quiet numpy scipy
      - name: Check original full-ACK short-gap optimum under source42
        run: python agents/agent8/k04_mt_global_ack_shortgap_milp_sft.py
      - name: Check all42 immediate cross-packet K04 target donors
        run: python agents/agent8/k04_all42_crosspacket_target_sft.py
      - name: Exhaust original K04 two-hop donor complete-coupon superset
        run: python agents/agent8/k04_twohop_6561_fullcoupon_sft.py
