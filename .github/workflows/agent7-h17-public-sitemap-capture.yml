name: Agent7 H17 bounded public sitemap capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Capture only robots and explicitly named sitemap URLs
        run: python work/h17_public_sitemap_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: h17-public-sitemap-report
          path: h17-public-sitemap-report.json
          if-no-files-found: error
          retention-days: 3
