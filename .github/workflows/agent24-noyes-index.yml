name: Agent 24 Noyes public correspondence index probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
      - name: Fetch linked public landing page
        run: python agents/agent24/noyes_index_probe.py
      - name: Commit captured HTML and link manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/assets/cowper/noyes-index-root.html results/assets/cowper/noyes-index-root.json
          if git diff --cached --quiet; then
            echo "No index capture changes"
          else
            git commit -m "Agent 24: Capture Noyes correspondence index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
