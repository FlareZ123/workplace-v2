name: Agent15 K04 textual-seed source discriminator
on:
  push:
    paths:
      - .github/workflows/agent15-k04-utf8-seed-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  textual-seed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm intact-source p951 UTF-8 seed gate and actual seeded positives
        run: python agents/agent15/k04_p951_utf8_seed_gate_sft.py
