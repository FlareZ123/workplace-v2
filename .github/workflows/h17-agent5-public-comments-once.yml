name: H17 Agent5 public HTML comments one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read-only public HTML comment census
        run: python agents/agent5/public_raw_comment_gate.py
