name: Agent 3 K08 PS-0323 Falcon page-word coordinates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract
      - name: Test PS-0323 as eight one-based printed-page/body-word pairs
        run: |
          set -o pipefail
          python agents/agent3/k08_ps0323_falcon_pageword.py | tee ps0323-falcon-pageword.log
      - name: Preserve page images, OCR and commitment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-k08-ps0323-falcon-pageword
          path: |
            work/agent3-ps0323-falcon-pageword/
            ps0323-falcon-pageword.log
          if-no-files-found: warn
          retention-days: 7
