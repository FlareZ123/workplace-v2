name: Agent50 K04 conditional printer-route sampler SFT
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-route-sampler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test planted CPython controls and 170 original-source chronologies
        run: python agents/agent50/k04_conditional_route_sampler_sft.py
