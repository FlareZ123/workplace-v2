name: Agent 11 K08 WN-14 page-word candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text extraction dependency
        run: python -m pip install pypdf
      - name: Test the single WN-14 coordinate constructor
        run: python agents/agent11/k08_wn14_riddle_coordinate_sft.py
