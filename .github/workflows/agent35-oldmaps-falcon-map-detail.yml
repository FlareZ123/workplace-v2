name: Agent35 OldMaps Falcon map detail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract source links from exact map page
        shell: python
        run: |
          import html, json, re, urllib.request
          url="https://www.oldmapsonline.org/en/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 H17-preservation-research"})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read().decode("utf-8","replace")
          decoded=html.unescape(data)
          print("PAGE_BYTES",len(data))
          for needle in [
              "ba4952a4-3077-5194-84bd-3bed1ad0349f",
              "e42e7c7e-5bf4-55e5-bf3b-04ec2532b2a3",
              "sysnum001988826",
              "flickr",
              "iiif",
              "British Library",
              "W. H. Allen",
              "KNIGHT",
          ]:
              hits=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
              print("NEEDLE",needle,"COUNT",len(hits))
              for pos in hits[:12]:
                  print("CONTEXT",decoded[max(0,pos-700):pos+1800].replace("\n"," "))
          urls=sorted(set(re.findall(r'https?://[^"\\s<>]+',decoded)))
          for u in urls:
              low=u.lower()
              if any(k in low for k in ["flickr","iiif","britishlibrary","oldmapsonline","bl.uk","archive.org"]):
                  print("SOURCE_URL",u[:3000])
