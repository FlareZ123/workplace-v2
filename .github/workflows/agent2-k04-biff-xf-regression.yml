name: H-17 K04/K08 workbook-source intake regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image intake test dependencies
        run: python -m pip install numpy pillow
      - name: Run source-shaped candidate and redaction tests
        env:
          PYTHONPATH: work
        run: |
          python -m py_compile \
            work/h17_witness_intake.py \
            work/h17_ax7782_object_intake.py \
            work/h17_k08_teal_bit_image_scan.py \
            work/h17_k04_pdf_barcode_intake.py \
            work/h17_k04_mug_stock_xf_probe.py \
            work/h17_k04_biff8_xf_candidate.py \
            work/h17_k04_mug_stock_xf_probe.py \
            work/test_h17_k04_biff8_xf_candidate.py \
            work/test_h17_k04_mug_stock_xf_probe.py \
            work/h17_k08_m10_raw_biff_probe.py \
            work/test_h17_k08_m10_raw_biff_probe.py \
            work/h17_k08_mug_stock_cell_selector.py \
            tests/test_h17_k08_m10_comment_selector.py \
            tests/test_h17_witness_intake_pdf_guard.py \
            tests/test_h17_intake_cli_redaction.py
          python -m unittest -v \
            work.test_h17_k04_biff8_xf_candidate \
            work.test_h17_k04_mug_stock_xf_probe \
            work.test_h17_k08_m10_raw_biff_probe
          python -m unittest discover -s tests -p 'test_h17_k08_m10_comment_selector.py'
          python -m unittest discover -s tests -p 'test_h17_witness_intake_pdf_guard.py'
          python -m unittest discover -s tests -p 'test_h17_intake_cli_redaction.py'
