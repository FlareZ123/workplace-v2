name: Agent 32 Cowper HathiTrust page OCR probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve Cowper Part I page OCR and metadata
        run: python agents/agent32/k08_cowper_hathitrust_pageocr.py
