name: H17 public correspondence access
on:
  workflow_dispatch:
jobs:
  inspect-public-record:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Search publicly linked pages for historical archive references
        shell: python
        run: |
          import re
          import urllib.request
          from collections import deque
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          BASE = "https://noyes-energy-group.pages.dev"
          class Parse(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.words=[]
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a":
                      href=dict(attrs).get("href")
                      if href: self.links.append(href)
              def handle_data(self, value):
                  self.words.append(value)

          queue=deque(["/"])
          seen=set()
          patterns=re.compile(r"(?i)h.?17|offshore|archive|print spool|records custodian|keeper|late watch|cabinet|incident")
          while queue and len(seen)<40:
              path=queue.popleft()
              if path in seen or path.startswith("/admin") or path.startswith("/api"):
                  continue
              seen.add(path)
              try:
                  with urllib.request.urlopen(urllib.request.Request(BASE+path,headers={"User-Agent":"H17RecordsArchive/1.0"}),timeout=8) as res:
                      text=res.read(100000).decode("utf-8",errors="replace")
                  parsed=Parse()
                  parsed.feed(text)
                  plain=" ".join(" ".join(parsed.words).split())
                  matches=[m.group(0) for m in patterns.finditer(plain)]
                  print(path,"chars",len(text),"matches",matches[:30])
                  if matches:
                      print("CONTEXT",plain[:6000])
                  for link in parsed.links:
                      absolute=urljoin(BASE+path,link)
                      part=urlsplit(absolute)
                      if part.netloc=="noyes-energy-group.pages.dev" and (part.path.endswith("/") or part.path=="/"):
                          if part.path not in seen:queue.append(part.path)
              except Exception as error:
                  print("error",path,str(error))
          print("VISITED",sorted(seen))
