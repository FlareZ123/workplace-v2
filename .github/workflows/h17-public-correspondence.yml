name: H17 public correspondence access
on:
  workflow_dispatch:
jobs:
  inspect-public-record:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public correspondence index
        shell: python
        run: |
          import urllib.request
          url = "https://noyes-energy-group.pages.dev/"
          request = urllib.request.Request(url, headers={"User-Agent": "H17RecordsArchive/1.0"})
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = response.read(200000)
                  print("URL:", response.url)
                  print("STATUS:", response.status)
                  print("CONTENT-TYPE:", response.headers.get("Content-Type"))
                  print("BODY-BEGIN")
                  print(payload.decode("utf-8", errors="replace"))
                  print("BODY-END")
          except Exception as error:
              print(type(error).__name__ + ": " + str(error))
              raise
