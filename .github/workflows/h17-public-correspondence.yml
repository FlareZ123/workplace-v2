name: H17 public correspondence access
on:
  workflow_dispatch:
jobs:
  inspect-public-record:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public pages and scripts
        shell: python
        run: |
          import html
          import re
          import urllib.request
          from html.parser import HTMLParser

          BASE = "https://noyes-energy-group.pages.dev"
          class Scrape(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.words = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag in ("a", "script", "form", "link"):
                      self.links.append((tag, data))
              def handle_data(self, data):
                  if data.strip():
                      self.words.append(data.strip())

          for path in ["/admin", "/assets/site.js", "/robots.txt", "/sitemap.xml", "/projects/", "/company/"]:
              print("\\n=== RESOURCE", path, "===")
              try:
                  with urllib.request.urlopen(urllib.request.Request(BASE+path, headers={"User-Agent":"H17RecordsArchive/1.0"}), timeout=15) as resp:
                      body = resp.read(100000).decode("utf-8","replace")
                      print("status",resp.status,"url",resp.url,"chars",len(body))
                      if "javascript" in resp.headers.get("Content-Type","") or path.endswith(".js") or path.endswith(".txt") or path.endswith(".xml"):
                          print(body[:16000])
                      else:
                          p = Scrape()
                          p.feed(body)
                          print("TEXT:", " ".join(p.words)[:12000])
                          print("LINKS:", p.links[:70])
                          print("EMBEDDED SCRIPTS:", re.findall(r"<script[^>]*>(.*?)</script>",body,re.S|re.I)[:5])
              except Exception as e:
                  print("ERROR",repr(e))
