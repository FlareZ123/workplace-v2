name: Agent2 H17 global-source raw caption joint feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-joint-original-printer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [35, 39]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Exact global source key word printable DP
        run: python agents/agent2/k04_n35_n39_global_source_joint_feasible_sft.py --n ${{ matrix.n }} --shard ${{ matrix.shard }}
