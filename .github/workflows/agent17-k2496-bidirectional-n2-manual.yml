name: Agent17 CPython K04 bidirectional seed n2 manual
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  necessary-source-inversion-n2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current bit-vector solver
        run: python -m pip install "bitwuzla==0.9.1"
      - name: Solve original 8 source projections, selected coupon withheld
        run: python agents/agent17/k04_cpython_k2496_bidirectional_sft.py --key-words 2 --solve --seconds 1200
