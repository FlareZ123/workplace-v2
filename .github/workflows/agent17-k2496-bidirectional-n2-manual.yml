name: Agent17 CPython K04 bidirectional seed source manual
on:
  workflow_dispatch:
    inputs:
      key_words:
        description: Number of CPython integer-seed words
        required: true
        type: choice
        options:
          - '2'
          - '3'
          - '4'
        default: '2'

permissions:
  contents: read

jobs:
  necessary-source-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current bit-vector solver
        run: python -m pip install "bitwuzla==0.9.1"
      - name: Solve original early source projections, selected coupon withheld
        run: python agents/agent17/k04_cpython_k2496_bidirectional_sft.py --key-words ${{ inputs.key_words }} --solve --seconds 1200
