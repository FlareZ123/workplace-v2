name: Agent19 K04 independent byte-lane search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-byte-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        lane: [0, 1, 2, 3]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Compile pinned offline original-checker
        run: cc -O3 -std=c11 -Wno-deprecated-declarations agents/agent19/k04_four_word_byte_lane_sft.c -lcrypto -o /tmp/k04lane
      - name: Planted full-component recovery control
        run: /tmp/k04lane self-test
      - name: Exhaust exact disjoint original shard
        run: /tmp/k04lane ${{ matrix.lane }} ${{ matrix.shard }} 8
