name: Agent13 CPython n24 Bitwuzla source inverse
on:
  workflow_dispatch:
jobs:
  n24:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Bitwuzla
        run: python -m pip install --upgrade pip && python -m pip install bitwuzla==0.9.1
      - name: Solve n24 with selected ACK2 withheld
        env:
          PYTHONUNBUFFERED: '1'
        run: python agents/agent13/k04_n24_bitwuzla_sft.py --timeout-seconds 3300 --control-timeout-seconds 120
      - name: Upload machine-readable solver result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent13-n24-bitwuzla-result
          path: agent13-n24-bitwuzla-result.json
          if-no-files-found: ignore
          retention-days: 7
