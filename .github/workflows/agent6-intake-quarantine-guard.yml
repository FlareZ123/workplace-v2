name: Agent 6 H17 intake quarantine guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - work/h17_ax7782_object_intake.py
      - work/h17_k04_binary_window_intake.py
      - work/h17_ax7782_k08_phrase_intake.py
      - work/test_h17_ax7782_object_intake.py
      - work/test_h17_ax7782_k08_phrase_intake.py
      - .github/workflows/agent6-intake-quarantine-guard.yml

permissions:
  contents: read

jobs:
  intake-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the PDF fixture dependency
        run: python -m pip install pypdf pillow numpy
      - name: Run focused read-only intake regressions
        run: python -m unittest -v work.test_h17_ax7782_object_intake work.test_h17_ax7782_k08_phrase_intake
