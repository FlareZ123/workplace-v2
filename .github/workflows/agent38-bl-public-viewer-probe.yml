name: Agent 38 BL public viewer route probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public catalogue, viewer and alternate OCR route
        run: |
          set -euo pipefail
          python agents/agent38/bl_public_viewer_probe.py
      - name: Upload bounded probe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent38-bl-public-viewer-probe
          path: probe-out/
          if-no-files-found: warn
          retention-days: 2
