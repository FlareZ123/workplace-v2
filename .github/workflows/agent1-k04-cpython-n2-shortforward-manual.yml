name: Agent1 K04 CPython n2 genuine long-startup short-forward

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent1-k04-cpython-k2496-n2
  cancel-in-progress: false

jobs:
  original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout historical source and reproducers
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install versioned Z3 QF_BV solver
        run: python -m pip install --disable-pip-version-check z3-solver==4.13.3.0
      - name: Genuine CPython controls and exact original selected-withheld n2 source fit
        run: python -u agents/agent1/k04_cpython_k2496_n2_ci_solver.py
