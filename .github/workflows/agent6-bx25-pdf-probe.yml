name: Agent 6 BX25-08 PDF probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-bx25-08:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf cryptography
      - name: Inspect BX25-08
        run: python agents/agent6/bx25_pdf_probe.py
