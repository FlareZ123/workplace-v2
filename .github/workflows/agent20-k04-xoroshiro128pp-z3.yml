name: Agent20 K04 xoroshiro128++ Z3 full-domain solve

on:
  workflow_dispatch:
    inputs:
      timeout_ms:
        description: "Z3 timeout per source view (milliseconds)"
        required: true
        default: "300000"

permissions:
  contents: read

jobs:
  solve:
    name: "Z3 source view ${{ matrix.view }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3
        run: python -m pip install --disable-pip-version-check z3-solver
      - name: Run synthetic control and full-domain source solve
        run: >-
          python agents/agent20/k04_xoroshiro128pp_z3_sft.py
          --view "${{ matrix.view }}"
          --timeout-ms "${{ inputs.timeout_ms }}"
          --control-timeout-ms 120000
          --result-path "k04-xoroshiro128pp-z3-view-${{ matrix.view }}.json"
      - name: Upload exact solver disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "k04-xoroshiro128pp-z3-view-${{ matrix.view }}"
          path: "k04-xoroshiro128pp-z3-view-${{ matrix.view }}.json"
          if-no-files-found: warn
