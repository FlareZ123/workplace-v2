name: Agent50 K04 direct-borrow first-pair synthetic control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    name: Unseeded planted direct-borrow positive control
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Z3
        run: python -m pip install --disable-pip-version-check z3-solver==4.15.4.0
      - name: Run unseeded planted first-pair control
        run: |
          set -o pipefail
          python agents/agent1/k04_xoroshiro128pp_z3_sft.py \
            --view 0 --timeout-seconds 300 --max-middle-models 8 --synthetic-only \
            | tee k04-first-pair-control.jsonl
      - name: Upload redacted control disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k04-first-pair-unseeded-control
          path: k04-first-pair-control.jsonl
          if-no-files-found: warn
          retention-days: 7
