name: Agent25 K04 K08 n35 n39 residual source seed crib
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-ASCII-crib:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        n: [35, 39]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Exact source-derived ASCII seed gate and real seeded Python controls
        run: python agents/agent25/k04_n35_n39_caption_source_sft.py --n ${{ matrix.n }} --shard ${{ matrix.shard }}
