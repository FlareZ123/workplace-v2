name: Agent 2 H17 New Cracking Mechanisms Smoke
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original archive and committed SFTs
        uses: actions/checkout@v4
      - name: Exact 128-bit modular ring retry inversion, planted and original
        run: python3 agents/agent2/k04_ring128_retry_hensel_sft.py resources
      - name: Compile the no-three-theme K08 source-bigram SFT
        run: g++ -O3 -std=c++17 -fopenmp agents/agent2/k08_implicit_motif_bigram_complement_sft.cpp -lcrypto -o /tmp/k08_implicit_motifs
      - name: K08 original and planted controls, omitted 2..9 word paths
        env:
          OMP_NUM_THREADS: "2"
        run: /tmp/k08_implicit_motifs resources 9 2
      - name: Compile original pre-final galley-email extension SFTs
        run: |
          g++ -O3 -std=c++17 -fopenmp agents/agent2/k08_prefinal_galley_mail02_12_newedge_sft.cpp -lcrypto -o /tmp/k08_galley_emails
          g++ -O3 -std=c++17 -fopenmp agents/agent2/k08_prefinal_galley_long_3motif_sft.cpp -lcrypto -o /tmp/k08_galley_long
      - name: New 155 galley-email bigrams, full new 2..8 word original checks
        env:
          OMP_NUM_THREADS: "2"
        run: /tmp/k08_galley_emails resources 8 2
      - name: New 155 galley-email bigrams, full 12 word three-motif original checks
        env:
          OMP_NUM_THREADS: "2"
        run: /tmp/k08_galley_long resources 12 12
      - name: Compile source-pinned October 3 galley log K08 tests
        run: |
          g++ -O3 -std=c++17 -fopenmp agents/agent2/k08_03oct_galley_log_newedges_sft.cpp -lcrypto -o /tmp/k08_03oct_short
          g++ -O3 -std=c++17 -fopenmp agents/agent2/k08_03oct_galley_log_long_three_motifs_sft.cpp -lcrypto -o /tmp/k08_03oct_long
      - name: Complete original K08 03 October galley log 2-11 word new edges
        env:
          OMP_NUM_THREADS: "2"
        run: /tmp/k08_03oct_short resources 11 2
      - name: Complete original K08 03 October galley log 12-14 word triple themes
        env:
          OMP_NUM_THREADS: "2"
        run: /tmp/k08_03oct_long resources 14 12
