name: Agent23 K04 xoroshiro128+/++ exceptional-gap inversion
on:
  workflow_dispatch:
jobs:
  original-source-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SMT solver
        run: python -m pip install z3-solver==4.13.3.0
      - name: Test original source and planted bridge
        run: python agents/agent23/k04_xoroshiro128pp_two_request_sft.py --view ${{ matrix.view }} --variant plus --timeout-ms 180000
