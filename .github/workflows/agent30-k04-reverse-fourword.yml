name: Agent30 K04 reverse-bridge four-output source gate

on:
  push:
    paths:
      - 'agents/agent30/k04_xoropp_reverse_fourword_sft.py'
      - '.github/workflows/agent30-k04-reverse-fourword.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-fourword:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-XOR solver
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Run exact circuit control, unseeded hidden coupon, then source views
        shell: bash
        run: |
          python -m py_compile agents/agent30/k04_xoropp_reverse_fourword_sft.py
          set -o pipefail
          python agents/agent30/k04_xoropp_reverse_fourword_sft.py --limit-seconds 240 | tee reverse-fourword-outcome.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k04-reverse-fourword-outcome
          path: reverse-fourword-outcome.ndjson
          if-no-files-found: warn
