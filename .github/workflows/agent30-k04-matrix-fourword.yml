name: Agent30 K04 GF2-matrix fourword source gate

on:
  push:
    paths:
      - 'agents/agent30/k04_xoropp_reverse_matrix_fourword_sft.py'
      - '.github/workflows/agent30-k04-matrix-fourword.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-fourword:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native XOR solver
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Run projected matrix, planted inverse, original-source holdout
        shell: bash
        run: |
          python -m py_compile agents/agent30/k04_xoropp_reverse_matrix_fourword_sft.py
          set -o pipefail
          python agents/agent30/k04_xoropp_reverse_matrix_fourword_sft.py --limit-seconds 240 | tee reverse-matrix-fourword-outcome.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k04-reverse-matrix-fourword-outcome
          path: reverse-matrix-fourword-outcome.ndjson
          if-no-files-found: warn
