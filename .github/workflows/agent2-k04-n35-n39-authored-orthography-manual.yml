name: Agent2 H17 n35 n39 authored raw-caption joint characters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-authored-raw-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [35, 39]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Exact original source English writing alphabet global gate
        run: python agents/agent2/k04_n35_n39_author_orthography_sft.py --n ${{ matrix.n }} --shard ${{ matrix.shard }}
