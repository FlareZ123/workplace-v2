name: Agent 32 British Library DSpace API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe DSpace bitstream endpoints
        run: python agents/agent32/k08_bl_dspace_api_probe.py
