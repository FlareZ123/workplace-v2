name: Agent41 H17 public index sitemap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read only public source-named XML sitemap
        shell: python
        run: |
          import hashlib
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          url = "https://noyes-energy-group.pages.dev/sitemap.xml"
          request = urllib.request.Request(url, headers={"User-Agent": "H17-records-preservation-public-index-review/1.0"})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read(65537)
                  print("status", response.status)
                  print("final_url", response.url)
                  print("content_type", response.headers.get("Content-Type"))
          except urllib.error.HTTPError as exc:
              print("http_status", exc.code)
              raise SystemExit(0)
          except urllib.error.URLError as exc:
              print("network_error", type(exc.reason).__name__)
              raise SystemExit(0)
          print("body_bytes", len(body))
          print("sha256", hashlib.sha256(body).hexdigest())
          print("body_prefix", body[:1500].decode("utf-8", errors="replace"))
          if len(body) > 65536:
              print("truncated")
              raise SystemExit(0)
          try:
              root = ET.fromstring(body)
              locs = [x.text for x in root.iter() if x.tag.split("}")[-1] == "loc" and x.text]
              print("sitemap_url_count", len(locs))
              for link in locs[:200]:
                  print("sitemap_loc", link)
          except ET.ParseError:
              print("not_xml")
