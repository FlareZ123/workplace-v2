name: Agent 25 K08 profile thumbnail-cache bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded image and XPS dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow fonttools lxml openpyxl cryptography
      - name: Run isolated K08 source-caption and profile-cache tests
        run: |
          python -m unittest discover -s tests -p 'test_h17_photo_caption_metadata.py' -v
          python -m unittest discover -s tests -p 'test_h17_profile_k08_thumbcache_bridge.py' -v
          python -m unittest discover -s tests -p 'test_h17_k08_teal_bit_image_scan.py' -v
          python -m unittest discover -s tests -p 'test_h17_k08_m10_comment_selector.py' -v
      - name: Run source-bounded K08 workbook selector tests
        run: python work/test_h17_k08_mug_stock_cell_selector.py
      - name: Run profile scanner self-test
        run: python work/h17_profile_k08_phrase_scan.py --self-test
