name: Agent 25 K08 profile thumbnail-cache bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded image and XPS dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow fonttools lxml
      - name: Run teal decoder and profile-cache bridge tests
        run: python -m unittest tests.test_h17_k08_teal_bit_image_scan tests.test_h17_profile_k08_thumbcache_bridge
      - name: Run profile scanner self-test
        run: python work/h17_profile_k08_phrase_scan.py --self-test
