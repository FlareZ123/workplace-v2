name: Agent40 H17 public Wayback CDX
on:
  workflow_dispatch:
jobs:
  public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query only historical public Wayback capture metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          HOST = "noyes-energy-group.pages.dev"
          BASE = "https://web.archive.org/cdx/search/cdx"
          requests = [
              {"url": HOST + "/*", "output": "json", "filter": "statuscode:200",
               "fl": "timestamp,original,statuscode,mimetype,length", "collapse": "urlkey", "limit": "200"},
              {"url": HOST + "/", "output": "json", "filter": "statuscode:200",
               "fl": "timestamp,original,statuscode,mimetype,length", "limit": "10"},
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def public_url(url):
              p = urllib.parse.urlsplit(url)
              return (p.scheme in ("http", "https") and p.hostname == HOST
                      and p.username is None and p.password is None
                      and not p.path.lower().startswith(("/admin", "/api", "/partner", "/account", "/login", "/signin")))
          print("PROBE_TIME", datetime.now(timezone.utc).isoformat(), flush=True)
          for q in requests:
              u = BASE + "?" + urllib.parse.urlencode(q)
              try:
                  with opener.open(urllib.request.Request(u, headers={"User-Agent": "H17-readonly-public-cdx-inventory/1.0"}), timeout=30) as response:
                      data = response.read(200001)
                      print("CDX", response.status, len(data), u, flush=True)
                      if len(data) > 200000:
                          print("CDX_OVERSIZE", flush=True)
                          continue
              except (urllib.error.URLError, TimeoutError, ValueError) as e:
                  print("CDX_ERROR", type(e).__name__, str(e)[:300], flush=True)
                  continue
              try:
                  rows = json.loads(data)
                  assert isinstance(rows, list)
              except (ValueError, AssertionError):
                  print("CDX_INVALID_JSON", repr(data[:400]), flush=True)
                  continue
              print("ROWS", max(0, len(rows)-1), flush=True)
              for row in rows[1:]:
                  if len(row) != 5 or not public_url(row[1]):
                      continue
                  print("PUBLIC_CAPTURE", "|".join(map(str, row)), flush=True)
          print("PUBLIC_WAYBACK_INDEX_COMPLETE", flush=True)
          PY
