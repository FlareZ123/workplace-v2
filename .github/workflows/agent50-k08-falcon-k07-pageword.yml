name: H-17 K08 K07-checkpoint Falcon page-word test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          tesseract --version
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract
      - name: Test K07 checkpoint page-word constructions against original K08 commitment
        run: |
          set -o pipefail
          python agents/agent50/k08_falcon_k07_pageword_sft.py | tee k07-falcon-pageword.log
      - name: Preserve page images, OCR, and complete candidate comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h17-k08-k07-falcon-pageword
          path: |
            work/agent50-k07-falcon-pageword/
            k07-falcon-pageword.log
          if-no-files-found: warn
          retention-days: 7
