name: Agent17 K04 compact symbolic triad inversion

on:
  workflow_dispatch:
    inputs:
      calibration_only:
        description: "Run only the frozen source-independent eight-state calibration"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compact-triad:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native XOR solver
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Compile and run compact triad calibration
        shell: bash
        run: |
          python -m py_compile agents/agent17/k04_xoropp_linear_elimination_sft.py
          set -o pipefail
          python agents/agent17/k04_xoropp_linear_elimination_sft.py --limit-seconds 120 --source-limit-seconds 240 --minimum-calibration-hits 6 ${{ inputs.calibration_only == true && '--calibration-only' || '' }} | tee compact-triad-outcome.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k04-compact-symbolic-triad
          path: compact-triad-outcome.ndjson
          if-no-files-found: warn
