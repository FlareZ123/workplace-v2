name: Agent 32 K08 British Library OCR page-word test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query public British Library OCR dataset and test K08 candidates
        run: python agents/agent32/k08_british_library_pageword_sft.py
