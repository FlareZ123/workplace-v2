name: Agent 43 K04 commitment-first self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact source-independent K04 full-coupon recovery
        run: python agents/agent25/k04_native_spool_commitment_bridge.py --self-test
