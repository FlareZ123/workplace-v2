name: Agent 43 K04 commitment-first self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact source-independent K04 full-coupon recovery
        run: python agents/agent25/k04_native_spool_commitment_bridge.py --self-test
      - name: Check compatibility with original K04 bridge unit test
        run: python -m unittest discover -s tests -p test_h17_k04_native_spool_commitment_bridge.py -v
      - name: Check shared original SPL SHD pairer regression
        run: python agents/agent43/h17_native_spool_pair_intake.py --self-test
