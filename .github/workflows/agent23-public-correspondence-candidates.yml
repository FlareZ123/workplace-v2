name: Agent 23 bounded anonymous public correspondence index probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-paths:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Inspect six source-motivated public index paths
        shell: python
        run: |
          import hashlib
          import re
          import urllib.error
          import urllib.request
          from urllib.request import HTTPRedirectHandler, build_opener, Request
          from urllib.parse import urlsplit

          HOST = "noyes-energy-group.pages.dev"
          PATHS = (
              "/",
              "/correspondence/",
              "/correspondence/index.html",
              "/correspondence-index/",
              "/records/",
              "/records/IR-261003-H17",
              "/archive/IR-261003-H17",
          )
          MATCH = re.compile(r"(?i)IR-261003-H17|PS-261003-0417|H[- ]?17|Emily|keeper|correspondence|archive|records")
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, url):
                  return None

          opener = build_opener(NoRedirect)
          homehash = None
          for path in PATHS:
              url = "https://" + HOST + path
              print("PATH", path, flush=True)
              try:
                  req = Request(url, headers={"User-Agent": "H17-ReadOnly-Historical-Index/1.0"})
                  with opener.open(req, timeout=12) as response:
                      body = response.read(180_001)
                      if len(body) > 180_000:
                          print("OVERSIZE", path, flush=True)
                          continue
                      final = response.geturl()
                      parsed = urlsplit(final)
                      if parsed.hostname != HOST or parsed.scheme != "https":
                          print("OUT_OF_SCOPE", path, flush=True)
                          continue
                      sha = hashlib.sha256(body).hexdigest()
                      if path == "/":
                          homehash = sha
                      text = body.decode("utf8", "replace")
                      title = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
                      matches = [m for m in MATCH.finditer(text)]
                      print("RESPONSE", response.status, "type", response.headers.get("content-type"),
                            "bytes", len(body), "sha256", sha, "same_as_home", sha == homehash,
                            "title", title.group(1)[:160].strip() if title else "",
                            "matches", len(matches), flush=True)
                      for m in matches[:8]:
                          print("HIT", repr(text[max(0, m.start()-80):m.end()+120]), flush=True)
              except urllib.error.HTTPError as exc:
                  print("HTTP_STATUS", exc.code, path, flush=True)
              except Exception as exc:
                  print("TRANSPORT", type(exc).__name__, str(exc)[:160], flush=True)
          print("COMPLETE", flush=True)
