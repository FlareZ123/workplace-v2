name: Agent 32 K08 Riddle page-word test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text extraction dependency
        run: python -m pip install pypdf
      - name: Test public 1903 scan against K08 commitment
        run: python agents/agent32/k08_riddle_pageword_sft.py
