name: H17 public archival index availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read publicly linked Noyes pages and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.visible = []
                  self.links = []
                  self.hidden = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('style','script','svg','noscript'):
                      self.hidden += 1
                  if tag == 'a':
                      d=dict(attrs)
                      if d.get('href'): self.links.append(d['href'])
              def handle_endtag(self, tag):
                  if tag in ('style','script','svg','noscript'):
                      self.hidden=max(0,self.hidden-1)
              def handle_data(self, data):
                  if not self.hidden and data.strip(): self.visible.append(data.strip())
          base='https://noyes-energy-group.pages.dev'
          paths=['/','/company/','/expertise/','/projects/','/insights/','/contact/','/sitemap.xml']
          for path in paths:
              req=Request(base+path,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36','Accept':'text/html,*/*'})
              try:
                  with urlopen(req,timeout=15) as r:
                      raw=r.read(100000).decode('utf-8','replace')
                      doc=Reader();doc.feed(raw)
                      print('PAGE',path,'STATUS',r.status)
                      print('TEXT',' | '.join(doc.visible)[:8000])
                      print('LINKS', sorted(set(doc.links))[:100])
                      if path.endswith('.xml'):print('XML',raw[:3000])
              except HTTPError as e:
                  print('PAGE',path,'HTTP_ERROR',e.code,'BODY',e.read(200).decode('utf-8','replace'))
              except Exception as e:
                  print('PAGE',path,'ERROR',type(e).__name__,str(e))
          PY
