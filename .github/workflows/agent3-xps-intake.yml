name: Agent3 H17 native XPS dual-slot intake regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-slot-xps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise native fixed-page extractor and both original intake paths
        run: python work/test_h17_xps_text.py
      - name: Install optional font parser for glyph-index fallback tests
        run: python -m pip install fonttools
      - name: Exercise coverage-safe Glyphs/Indices fallback
        run: python work/test_h17_xps_glyph_indices.py
      - name: Install raster QR and linear barcode test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 tesseract-ocr fonts-dejavu-core
          python -m pip install pillow pyzbar qrcode pymupdf pytesseract
      - name: Exercise exact K04 coupon barcode recovery, positive and negative
        env:
          PYTHONPATH: work
        run: python -m unittest -v work.test_h17_k04_image_barcode_intake
      - name: Prove authored coupon restoration across Office XML style runs
        env:
          PYTHONPATH: work
        run: python -m unittest -v work.test_h17_ooxml_text_intake
      - name: Search original H17 export through all new native K04 readers
        env:
          PYTHONPATH: work
        run: python work/h17_k04_native_source_original_scan.py
      - name: Search original H17 export for the selected K08 authored text
        env:
          PYTHONPATH: work
        run: python work/h17_k08_native_source_original_scan.py
      - name: Confirm existing read-only K04 and K08 positive controls
        run: |
          python work/h17_k04_binary_window_intake.py --self-test
          python work/h17_profile_k08_phrase_scan.py --self-test
