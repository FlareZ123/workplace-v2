name: Agent2 exact GF2 seq47 EVENT LATCH AUX rejection witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_source_rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Joint original-source event/latch/aux rejection analysis
        run: python agents/agent2/k04_seq47_exact_joint_reject_sft.py
      - name: Frozen 24-permutation full-field source-order calibration
        run: python agents/agent2/k04_recorder_field_order_source_calibration_sft.py

      - name: Source-anchored all-rejection-length 24-order placement screen
        run: python agents/agent2/k04_recorder_all_order_accepted_anchors_sft.py

      - name: Source metadata shuffle and exact 24-order null
        run: python agents/agent2/k04_recorder_order_meta_permutation_sft.py

      - name: Source-anchored fixed hidden draw gap with exact rejection constraints
        run: python agents/agent2/k04_recorder_hidden_gap_reject_sft.py

      - name: Five-field timestamp plus exact rejection source stage challenge
        run: python agents/agent2/k04_recorder_timestamp_five_field_reject_sft.py
