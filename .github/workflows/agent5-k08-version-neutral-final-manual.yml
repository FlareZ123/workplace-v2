name: Agent5 K08 version-neutral final candidate stream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-candidate-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Validate source-aware version-neutral final prompt
        run: |
          python -m py_compile agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py agents/agent8/k08_independent_lexical_ab_3b_sft.py
          python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case 0 --smoke
      - name: Generate 100 unique final keeper-caption candidates
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          python agents/agent8/k08_independent_lexical_ab_3b_sft_v3.py --case 0 --beams 64 2>&1 | tee "k08-version-neutral-final.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent5-k08-version-neutral-final-${{ github.run_id }}
          path: k08-version-neutral-final.log
          if-no-files-found: ignore
          retention-days: 14
