name: Agent 49 Cowper Part I Google alias probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe bounded Google Books aliases
        run: python agents/agent49/cowper_part1_google_alias_probe.py
