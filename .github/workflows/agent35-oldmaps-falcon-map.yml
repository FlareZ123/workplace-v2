name: Agent35 OldMaps Falcon map record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact OldMaps record
        shell: python
        run: |
          import json, urllib.request
          urls = [
              "https://api.oldmapsonline.org/1.0/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f",
              "https://api.oldmapsonline.org/1.0/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f/georeferences",
              "https://www.oldmapsonline.org/en/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f",
          ]
          headers={"User-Agent":"Mozilla/5.0 H17-preservation-research"}
          for url in urls:
              print("OMO_URL", url)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read().decode("utf-8","replace")
                      print("OMO_STATUS",r.status,"BYTES",len(data))
                  print("OMO_BODY",data[:20000].replace("\n"," "))
              except Exception as exc:
                  print("OMO_ERROR",repr(exc))
