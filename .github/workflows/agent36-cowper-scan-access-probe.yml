name: Agent36 Cowper scan access probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-scan-probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact public Cowper scan identifiers
        run: python agents/agent36/cowper_scan_access_probe.py
      - name: Preserve viewer responses and representative public page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent36-cowper-scan-probe
          path: cowper-probe/
          if-no-files-found: warn
          retention-days: 7
