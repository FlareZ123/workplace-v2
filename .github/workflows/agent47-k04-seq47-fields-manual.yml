name: Agent47 source-only seq47 EVENT AUX stage
on:
  workflow_dispatch:
jobs:
  source_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-only seq47 alternative stages
        run: python agents/agent47/k04_seq47_event_aux_joint_sft.py
