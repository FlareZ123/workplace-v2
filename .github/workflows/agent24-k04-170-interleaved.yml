name: Agent24 H17 K04 170-chronology split-metadata writer
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-fitted interleaved CLASS DEST writer across 170 chronologies
        run: python agents/agent24/k04_170_interleaved_metadata_sft.py
