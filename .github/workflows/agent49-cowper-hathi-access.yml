name: Agent 49 Cowper HathiTrust browser-access probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hathi-access:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public-domain HathiTrust viewer with session and referer
        run: python agents/agent36/cowper_scan_access_probe.py --target hathi-access
      - name: Preserve viewer and image responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent49-cowper-hathi-access
          path: cowper-probe/
          if-no-files-found: warn
          retention-days: 7
