name: H-17 legacy Office and SQLite intake regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LibreOffice and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc libreoffice-writer
          python -m pip install --upgrade pip
          python -m pip install openpyxl pillow python-docx lxml numpy pypdf
      - name: Compile read-only intake adapters
        run: |
          python -m py_compile \
            work/h17_doc_lo_fallback.py \
            work/h17_xls_lo_fallback.py \
            work/h17_biff_officeart.py \
            work/test_h17_biff_officeart.py \
            work/h17_biff_officeart_blips.py \
            work/test_h17_biff_officeart_blips.py \
            work/h17_ax7782_object_intake.py \
            work/h17_ax7782_k08_phrase_intake.py \
            work/h17_k04_binary_window_intake.py \
            work/h17_complete_native_recovery.py \
            work/test_h17_complete_native_recovery.py \
            work/h17_ax7782_k08_sqlite_bridge.py \
            work/h17_ax7782_joint_intake.py \
            work/h17_sticky_notes_intake.py \
            work/test_h17_ax7782_object_intake.py \
            work/test_h17_ax7782_k08_phrase_intake.py
      - name: Run DOC, XLS, SQLite/WAL and joint-intake regression tests
        env:
          PYTHONPATH: work
        run: |
          python -m unittest -v \
            work.test_h17_ax7782_object_intake \
            work.test_h17_ax7782_k08_phrase_intake \
            work.test_h17_complete_native_recovery \
            work.test_h17_doc_lo_fallback \
            work.test_h17_xls_lo_fallback \
            work.test_h17_biff_officeart \
            work.test_h17_biff_officeart_blips \
            work.test_h17_ax7782_k08_sqlite_bridge \
            work.test_h17_ax7782_joint_intake \
            work.test_h17_sticky_notes_intake
      - name: Run K04 OLE/CFB raw-window original-component positive control
        env:
          PYTHONPATH: work
        run: python work/h17_k04_binary_window_intake.py --self-test
      - name: Run source-limited N14 teal-image positive and negative controls
        run: |
          python -m unittest discover -s tests -p 'test_h17_k08_teal_bit_image_scan.py' -v
