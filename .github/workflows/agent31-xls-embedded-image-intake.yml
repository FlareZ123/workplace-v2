name: Agent 31 — legacy XLS embedded-image intake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LibreOffice and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
          python -m pip install --upgrade pip
          python -m pip install openpyxl pillow
      - name: Compile adapter and test
        run: |
          python -m py_compile work/h17_xls_lo_fallback.py work/test_h17_xls_lo_fallback.py
          python -m unittest work.test_h17_xls_lo_fallback -v
