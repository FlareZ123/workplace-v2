name: Agent 14 K08 Ransome plain-text edition gate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-complete-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test complete published text with original K08 commitment
        run: |
          python agents/agent14/k08_ransome_plaintext_gate_sft.py \
            resources/evidence/recovery-routing.json \
            resources/acceptance.json \
            k08-ransome-20180428-gate.json
      - name: Save compact source manifest and acceptance result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: k08-ransome-20180428-plaintext-gate
          path: k08-ransome-20180428-gate.json
          retention-days: 30
