name: Agent8 K08 3B scene capsules exact historical and final
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case_id: [2, 6, 17, 18, 0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Authentic original-source and quotation-leak smoke
        run: python agents/agent8/k08_semantic_capsule_3b_sft.py --case ${{ matrix.case_id }} --smoke
      - name: Emit blind full candidates and test original commitment
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python agents/agent8/k08_semantic_capsule_3b_sft.py --case ${{ matrix.case_id }} --beams 64
