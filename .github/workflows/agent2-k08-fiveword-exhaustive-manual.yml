name: Agent 2 H17 Emily Fiveword Exhaustive Manual
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k08-source-vocabulary-fiveword:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        start: [0, 9, 18, 27, 36, 45, 54, 63, 72, 81]
    steps:
      - name: Read unmodified historical archive
        uses: actions/checkout@v4
      - name: Compile exact original-source fiveword reducer
        run: g++ -O3 -std=c++17 -Wno-deprecated-declarations agents/agent2/k08_emily_fiveword_product_sft.cpp -lcrypto -o /tmp/k08five
      - name: Original K08 complete first-word partition
        env:
          START: ${{ matrix.start }}
        run: |
          END=$((START + 9))
          /tmp/k08five resources/evidence/crew/noticeboard-and-desk-notes.txt "$START" "$END"
