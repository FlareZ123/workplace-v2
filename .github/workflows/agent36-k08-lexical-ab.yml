name: Agent36 K08 lexical evidence paired A-B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-author-rank:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [2, 6, 17, 18]
    name: paired-case-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate holdout and strict-mask invariants
        run: |
          python -m py_compile agents/agent36/k08_blind_author_rank_lexical_ab.py
          python agents/agent36/k08_blind_author_rank_lexical_ab.py --smoke --case ${{ matrix.case }}
      - name: Install same pinned CPU model packages as Agent9 baseline
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "transformers==4.57.1" "accelerate>=1.0,<2"
      - name: Execute paired A/B historical caption ranking
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python agents/agent36/k08_blind_author_rank_lexical_ab.py --case ${{ matrix.case }}
      - name: Preserve manifests and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent36-k08-lexical-ab-case-${{ matrix.case }}
          path: k08-ab-out/
          if-no-files-found: warn
          retention-days: 7
