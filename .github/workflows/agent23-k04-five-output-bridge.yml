name: Agent23 K04 five-output reverse coupon bridge

on:
  workflow_dispatch:
    inputs:
      limit_seconds:
        description: "Per-instance CryptoMiniSat timeout (1 to 300 seconds)"
        required: false
        type: number
        default: 180

permissions:
  contents: read

jobs:
  five-output-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native XOR solver
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Run exact witness controls and source-bearing solver
        shell: bash
        run: |
          python -m py_compile agents/agent23/k04_xoropp_five_output_bridge_sft.py
          set -o pipefail
          python agents/agent23/k04_xoropp_five_output_bridge_sft.py --limit-seconds "${{ inputs.limit_seconds }}" | tee agent23-five-output-outcome.ndjson
      - name: Preserve complete result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent23-five-output-bridge-outcome
          path: agent23-five-output-outcome.ndjson
          if-no-files-found: warn
