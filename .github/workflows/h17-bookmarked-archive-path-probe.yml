name: H17 exact bookmarked archive-path probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check exact remaining bookmark paths without exposing codes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          base = "https://noyes-energy-group.pages.dev"
          paths = [
              "/Stores/returns/SEP26/index.htm",
              "/Finance/PrevERP/posted-items-26.xls",
              "/Finance/PrevERP/reversal-register.htm",
              "/Finance/letterheads/EG-operator-2025.pdf",
              "/Finance/PrevERP/bench-expenses-2025.xls",
              "/Risk/H17-POL-17/renewal-ledger-2025.xlsx",
              "/Risk/Transfers/BX25/transfer-index.htm",
              "/IT/desk-images/oldscan/scanrelease.txt",
              "/Risk/hired-plant/CS-18/loan-set-register.htm",
              "/Records/blank-request-form.doc",
          ]
          route = json.load(open("resources/evidence/recovery-routing.json", encoding="utf-8"))
          acceptance = json.load(open("resources/acceptance.json", encoding="utf-8"))
          nonce = bytes.fromhex(route["K08"]["desk_nonce"])
          target = acceptance["slot_sha256"]["K08"]

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.refs = []
                  self.title = False
                  self.title_parts = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag.lower() == "title":
                      self.title = True
                  for key in ("href", "src", "action"):
                      if a.get(key):
                          self.refs.append(a[key])
                  for key in ("alt", "title", "aria-label", "content", "value", "placeholder"):
                      if a.get(key):
                          self.parts.append(a[key])
              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.title = False
              def handle_data(self, data):
                  if data.strip():
                      self.parts.append(data.strip())
                  if self.title:
                      self.title_parts.append(data.strip())
              def handle_comment(self, data):
                  if data.strip():
                      self.parts.append(data.strip())

          def normalize(value):
              return " ".join(re.sub(r"[^a-z0-9\\s]", " ", value.lower()).split())

          def scan_k08(text):
              words = normalize(text).split()
              count = 0
              hits = []
              for n in range(1, min(32, len(words)) + 1):
                  for i in range(len(words) - n + 1):
                      phrase = " ".join(words[i:i+n])
                      count += 1
                      mac = hmac.new(nonce, phrase.encode("utf-8"), hashlib.sha256).digest()[:16]
                      if hashlib.sha256(mac).hexdigest() == target:
                          hits.append(phrase)
              return count, sorted(set(hits))

          results = []
          for path in paths:
              url = urllib.parse.urljoin(base, path)
              req = urllib.request.Request(url, headers={"User-Agent": "H17-archive-research/1.0"})
              item = {"path": path, "url": url}
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      data = response.read(2_000_000)
                      ctype = response.headers.get("Content-Type", "")
                      item.update({
                          "status": response.status,
                          "final_url": response.geturl(),
                          "content_type": ctype,
                          "bytes_read": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      })
                      text = data.decode("utf-8", errors="replace")
                      if "html" in ctype.lower():
                          parser = Page()
                          parser.feed(text)
                          corpus = " ".join(parser.parts)
                          item["title"] = " ".join(" ".join(parser.title_parts).split())[:200]
                          refs = []
                          for ref in parser.refs:
                              absolute = urllib.parse.urljoin(response.geturl(), ref)
                              if urllib.parse.urlparse(absolute).netloc == urllib.parse.urlparse(base).netloc:
                                  refs.append(urllib.parse.urlparse(absolute).path)
                          item["same_origin_paths"] = sorted(set(refs))[:200]
                          ngrams, hits = scan_k08(corpus)
                          item["k08_ngram_assignments_1_to_32"] = ngrams
                          item["k08_exact_hits"] = hits
                      elif "text" in ctype.lower() or path.endswith(".txt"):
                          corpus = text
                          ngrams, hits = scan_k08(corpus)
                          item["k08_ngram_assignments_1_to_32"] = ngrams
                          item["k08_exact_hits"] = hits
                          item["reference_flags"] = {term: term.lower() in text.lower() for term in ("FA-17","BX25/08","RN-052","H17-POL-17/A3","IR-261003-H17","SEP26","WN-14")}
                          if path.endswith("scanrelease.txt") or path.endswith("transfer-index.htm"):
                              tokens = re.findall(r"(?<!\\d)\\d{4}(?!\\d)", text)
                              item["four_digit_token_count"] = len(tokens)
                              item["four_digit_token_sha256"] = hashlib.sha256(" ".join(tokens).encode()).hexdigest()
                      else:
                          item["binary_metadata_only"] = True
              except urllib.error.HTTPError as e:
                  data = e.read(200_000)
                  item.update({"status": e.code, "content_type": e.headers.get("Content-Type", ""), "bytes_read": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              except Exception as e:
                  item.update({"status": "ERROR", "error_type": type(e).__name__, "error": str(e)[:240]})
              results.append(item)

          with open("h17-bookmarked-archive-path-probe.json", "w", encoding="utf-8") as f:
              json.dump({"base": base, "k08_commitment": target, "results": results}, f, indent=2)
          print(json.dumps(results, indent=2))
          PY
      - name: Upload metadata-only bookmark path results
        uses: actions/upload-artifact@v4
        with:
          name: h17-bookmarked-archive-path-probe
          path: h17-bookmarked-archive-path-probe.json
          retention-days: 1
