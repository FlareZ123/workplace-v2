name: Agent30 NumPy pool622 late repeated-lane inverse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-wrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install "numpy>=2.0,<3"
      - name: Genuine seeded controls and original complete pool622 wrap inverse
        run: python agents/agent30/k04_numpy_pool622_wrap_sft.py
