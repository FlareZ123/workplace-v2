name: H17 source-linked public annotation witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-original-annotations:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read only publicly linked HTML annotation carriers
        run: python agents/agent17/h17_public_annotation_census.py
