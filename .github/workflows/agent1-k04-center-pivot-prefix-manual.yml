name: Agent1 K04 branch decomposed triad calibration
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CryptoMiniSat Python interface
        run: python -m pip install --disable-pip-version-check pycryptosat==5.14.7
      - name: Execute prefix-calibrated frozen synthetic controls only
        shell: bash
        run: |
          python -m py_compile agents/agent1/k04_center_pivot_prefix_partition_sft.py
          set -o pipefail
          python agents/agent1/k04_center_pivot_prefix_partition_sft.py --seconds 30 --state-count 8 | tee branch-decomposition.ndjson
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k04-center-pivot-branch-calibration
          path: branch-decomposition.ndjson
          if-no-files-found: warn
