name: Agent 10 K08 exact 1889 Falcon WN-14 page-word candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          tesseract --version
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract
      - name: Fetch exact 1889 Google Books pages and test frozen WN-14 coordinates
        run: |
          set -o pipefail
          python agents/agent10/k08_falcon_1889_pageword.py | tee falcon-1889-pageword.log
      - name: Preserve exact page images, OCR and commitment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent10-k08-falcon-1889-pageword
          path: |
            falcon-1889-pageword-probe/
            falcon-1889-pageword.log
          if-no-files-found: warn
          retention-days: 7
