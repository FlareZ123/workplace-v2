name: H-17 K08 shared 1889 Falcon page-word batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          tesseract --version
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract
      - name: Resolve both frozen coordinate sets through one shared cache
        run: |
          set -o pipefail
          python agents/agent16/k08_falcon_dual_batch.py | tee falcon-1889-dual-batch.log
      - name: Preserve shared folio map, page images, OCR and separate commitment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h17-k08-falcon-dual-batch
          path: |
            work/agent16-falcon-dual-batch/
            falcon-1889-dual-batch.log
          if-no-files-found: warn
          retention-days: 7
