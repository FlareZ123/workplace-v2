name: H-17 K08 shared 1889 Falcon page-word batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageword:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the existing capture and batch scripts
        run: |
          node --check agents/agent7/k08_falcon_signed_pages.cjs
          python -m py_compile agents/agent16/k08_falcon_dual_batch.py
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture every viewer-signed image in the frozen scan-index union
        run: |
          set -o pipefail
          node agents/agent7/k08_falcon_signed_pages.cjs | tee falcon-1889-signed-capture.log
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          tesseract --version
          python -m pip install --upgrade pip
          python -m pip install pillow pytesseract
      - name: Resolve both frozen coordinate sets across the complete signed union
        run: |
          set -o pipefail
          python agents/agent16/k08_falcon_dual_batch.py | tee falcon-1889-dual-batch.log
      - name: Preserve signed scan images, complete folio evidence, OCR and separate commitment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h17-k08-falcon-dual-batch
          path: |
            work/agent7-falcon-signed-dual/
            work/agent16-falcon-dual-batch/
            falcon-1889-signed-capture.log
            falcon-1889-dual-batch.log
          if-no-files-found: warn
          retention-days: 7
