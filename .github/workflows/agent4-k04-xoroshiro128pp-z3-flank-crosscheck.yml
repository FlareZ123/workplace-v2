name: Agent4 K04 xoroshiro128++ Z3 request-flank cross-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-flank:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        view: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SMT solver
        run: python -m pip install z3-solver==4.13.3.0
      - name: Solve the two REQUESTED flanks, predict the held-out ACK2, and test the full K04 commitment
        run: python agents/agent23/k04_xoroshiro128pp_two_request_sft.py --view ${{ matrix.view }} --variant plusplus --timeout-ms 180000
