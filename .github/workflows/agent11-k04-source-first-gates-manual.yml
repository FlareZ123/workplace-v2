name: Agent11 source-first K04 model gates
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unknown affine GF2 stride-four generator with synthetic controls
        run: python3 agents/agent11/k04_unknown_linear_stride4_source_sft.py
      - name: CPython 53-bit joint metadata issuer source controls
        run: python3 agents/agent11/k04_randfloat_joint_metadata_sft.py
