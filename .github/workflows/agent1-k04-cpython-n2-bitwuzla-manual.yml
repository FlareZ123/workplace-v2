name: Agent1 K04 CPython n2 independent Bitwuzla short-forward

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent1-k04-cpython-k2496-n2-bitwuzla
  cancel-in-progress: false

jobs:
  original-source-bitwuzla:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout historical source and SFT
        uses: actions/checkout@v4
      - name: Python 3.11 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bitwuzla 0.9.1
        run: python -m pip install --disable-pip-version-check bitwuzla==0.9.1
      - name: Original source only and 132-packet heldout candidate check
        run: python -u agents/agent1/k04_cpython_k2496_n2_bitwuzla_sft.py
