name: Agent22 OldMaps Falcon color diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Measure exact OldMaps Falcon raster variants
        shell: python
        run: |
          import hashlib
          import html
          import io
          import json
          import re
          import urllib.request
          from PIL import Image, ImageStat

          page_url = "https://www.oldmapsonline.org/en/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f"
          headers = {"User-Agent": "Mozilla/5.0 H17-preservation-research"}

          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              page = html.unescape(response.read().decode("utf-8", "replace"))

          match = re.search(r'https://thumbs[.]oldmapsonline[.]org/[^" ]+thumbnail-150-fill[.]webp[?][^" ]+', page)
          if not match:
              raise RuntimeError("Exact map page did not expose its thumbnail URL")
          exact = match.group(0).replace(r"\u0026", "&")
          variants = ["150-fill", "300-fill", "600-fill", "1000-fit", "1200-fill"]

          for variant in variants:
              url = exact.replace("thumbnail-150-fill.webp", f"thumbnail-{variant}.webp")
              row = {"variant": variant}
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      row["status"] = response.status
                      row["content_type"] = response.headers.get("Content-Type")
                  row["bytes"] = len(data)
                  row["sha256"] = hashlib.sha256(data).hexdigest()
                  image = Image.open(io.BytesIO(data)).convert("RGB")
                  row["dimensions"] = list(image.size)
                  sat = sorted(image.convert("HSV").getchannel("S").getdata())
                  n = len(sat)
                  row["sat_mean_0_255"] = round(sum(sat) / n, 4)
                  row["sat_p95_0_255"] = sat[min(n - 1, int(n * 0.95))]
                  row["sat_max_0_255"] = sat[-1]
                  row["fraction_sat_ge_20"] = round(sum(v >= 20 for v in sat) / n, 6)
                  pixels = list(image.getdata())
                  row["fraction_non_gray_delta_ge_8"] = round(
                      sum(max(p) - min(p) >= 8 for p in pixels) / n, 6
                  )
                  row["rgb_mean"] = [round(x, 3) for x in ImageStat.Stat(image).mean]
              except Exception as exc:
                  row["error"] = f"{type(exc).__name__}: {exc}"
              print("FALCON_OMO_COLOR " + json.dumps(row, sort_keys=True))

      - name: Probe exact OldMaps IIIF identifiers
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request

          headers = {"User-Agent": "Mozilla/5.0 H17-preservation-research"}
          ids = [
              "ba4952a4-3077-5194-84bd-3bed1ad0349f",
              "801f1d6c572c4eec84d90674dae1bb08",
          ]
          templates = [
              "https://iiif-3.oldmapsonline.org/iiif/3/{id}/info.json",
              "https://iiif-2.oldmapsonline.org/iiif/2/{id}/info.json",
              "https://iiif.oldmapsonline.org/iiif/2/{id}/info.json",
              "https://iiif.oldmapsonline.org/{id}/info.json",
          ]
          for ident in ids:
              for template in templates:
                  url = template.format(id=ident)
                  row = {"url": url}
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read(65536)
                          row["status"] = response.status
                          row["content_type"] = response.headers.get("Content-Type")
                          row["final_url"] = response.geturl()
                      try:
                          data = json.loads(body)
                          row["json_keys"] = sorted(data)[:30]
                          row["width"] = data.get("width")
                          row["height"] = data.get("height")
                          row["id"] = data.get("id") or data.get("@id")
                      except Exception:
                          row["body_prefix"] = body[:240].decode("utf-8", "replace")
                  except urllib.error.HTTPError as exc:
                      row["error"] = f"HTTP {exc.code}"
                  except Exception as exc:
                      row["error"] = f"{type(exc).__name__}: {exc}"
                  print("FALCON_OMO_IIIF " + json.dumps(row, sort_keys=True))
