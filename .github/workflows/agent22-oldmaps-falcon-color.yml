name: Agent22 OldMaps Falcon color diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Measure exact OldMaps Falcon raster variants
        shell: python
        run: |
          import hashlib
          import html
          import io
          import json
          import re
          import urllib.request
          from PIL import Image, ImageStat

          page_url = "https://www.oldmapsonline.org/en/maps/ba4952a4-3077-5194-84bd-3bed1ad0349f"
          headers = {"User-Agent": "Mozilla/5.0 H17-preservation-research"}

          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              page = html.unescape(response.read().decode("utf-8", "replace"))

          match = re.search(r'https://thumbs[.]oldmapsonline[.]org/[^" ]+thumbnail-150-fill[.]webp[?][^" ]+', page)
          if not match:
              raise RuntimeError("Exact map page did not expose its thumbnail URL")
          exact = match.group(0).replace(r"\u0026", "&")
          variants = ["150-fill", "300-fill", "600-fill", "1000-fit", "1200-fill"]

          for variant in variants:
              url = exact.replace("thumbnail-150-fill.webp", f"thumbnail-{variant}.webp")
              row = {"variant": variant}
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      row["status"] = response.status
                      row["content_type"] = response.headers.get("Content-Type")
                  row["bytes"] = len(data)
                  row["sha256"] = hashlib.sha256(data).hexdigest()
                  image = Image.open(io.BytesIO(data)).convert("RGB")
                  row["dimensions"] = list(image.size)
                  sat = sorted(image.convert("HSV").getchannel("S").getdata())
                  n = len(sat)
                  row["sat_mean_0_255"] = round(sum(sat) / n, 4)
                  row["sat_p95_0_255"] = sat[min(n - 1, int(n * 0.95))]
                  row["sat_max_0_255"] = sat[-1]
                  row["fraction_sat_ge_20"] = round(sum(v >= 20 for v in sat) / n, 6)
                  pixels = list(image.getdata())
                  row["fraction_non_gray_delta_ge_8"] = round(
                      sum(max(p) - min(p) >= 8 for p in pixels) / n, 6
                  )
                  row["rgb_mean"] = [round(x, 3) for x in ImageStat.Stat(image).mean]
              except Exception as exc:
                  row["error"] = f"{type(exc).__name__}: {exc}"
              print("FALCON_OMO_COLOR " + json.dumps(row, sort_keys=True))
